[package]
name = "terminal_completion"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
path = "src/terminal_completion.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-recursion = "1.0.0"
async-trait = "0.1.89"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getset = "0.1.1"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
itertools = "0.14.0"
lazy_static = "1.4.0"
log = { version = "0.4", features = ["serde", "std"] }
memo-map = "0.3.1"
regex = "1.11.1"
serde = { version = "1.0", features = ["derive", "rc"] }
smol_str = "0.2.2"
typed-path = "0.10.0"
derive-new = "0.5.8"
fuzzy-matcher = "0.3.7"
terminal_core = { path = "../terminal_core" }
serde_json = "1.0"
serde_with = "3.21"
html-escape = "0.2.13"
rayon = "1.5.3"
rust-embed = { version = "6.4.2", features = ["debug-embed", "include-exclude"] }
