[package]
name = "terminal_core"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
path = "src/terminal_core.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
async-channel = "2.3.1"
base64 = "0.22"
bitflags = { version = "2.4.0", features = ["serde"] }
bitflags-serde-legacy = "0.1.1"
bounded-vec-deque = "0.1"
cfg-if = "1.0.0"
get-size = { version = "0.1.4", features = ["derive"] }
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp"] }
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
itertools = "0.14.0"
lazy_static = "1.4.0"
log = { version = "0.4", features = ["serde", "std"] }
ordered-float = { version = "3.0.0", features = ["serde"] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5.1"
rand = "0.8.6"
rangemap = "1.3.0"
regex = "1.11.1"
regex-automata = "0.4.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
shellexpand = "3.1.1"
static_assertions = "1.1.0"
thiserror = "2.0.17"
typed-path = "0.10.0"
unicode-general-category = "1.1.0"
unicode-width = "0.1.12"
urlocator = "0.1.4"
uuid = { version = "1.1.2", features = ["v4", "v5", "serde", "js"] }
vec1 = { version = "1.8.0", features = ["serde"] }
vte = { git = "https://github.com/warpdotdev/vte.git", rev = "4b399c87b63ba88f45709edaa6383fc519f6c900", default-features = false }
num-traits = "0.2"
derive_more = "0.99.17"
num-derive = "0.4"
float-cmp = "0.9.0"
byte-unit = "5.1.4"
flate2 = "1.0.17"
gethostname = "1.1.0"
bimap = "0.6.2"
